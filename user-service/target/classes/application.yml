server:
  port: 8081

spring:
  application:
    name: user-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/rentro_db
    username: rentro_user
    password: rentro_pass
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

jwt:
  secret: mySecretKey
  expiration: 86400000 # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.rentro.user: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/rentro_db
  data:
    redis:
      host: redis
