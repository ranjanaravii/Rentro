server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**, /api/auth/**
        - id: property-service
          uri: http://property-service:8082
          predicates:
            - Path=/api/properties/**
        - id: booking-service
          uri: http://booking-service:8083
          predicates:
            - Path=/api/bookings/**
        - id: notification-service
          uri: http://notification-service:8084
          predicates:
            - Path=/api/notifications/**
        - id: society-service
          uri: http://society-service:8085
          predicates:
            - Path=/api/societies/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
